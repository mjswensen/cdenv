name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Workspace quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run checks in the development container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: CARGO_TERM_COLOR
          runCmd: cargo xtask check

  devcontainer-profile-release-gate:
    name: Dev Container profile (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run editor-independent profile gate
        env:
          CDENV_INTEGRATION: "1"
        run: cargo xtask test-integration --suite devcontainer-v1

  openssh-release-gate:
    name: OpenSSH interoperability (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run standard OpenSSH interoperability gate
        env:
          CDENV_INTEGRATION: "1"
        run: cargo xtask test-integration --suite openssh

  macos-agent-stub:
    name: Agent unsupported-host stub
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check agent targets
        run: cargo check --package cdenv-agent --all-targets --locked

  linux-agent-targets:
    name: Agent Linux musl targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Check static agent targets
        run: |
          cargo check --package cdenv-agent --target x86_64-unknown-linux-musl --locked
          cargo check --package cdenv-agent --target aarch64-unknown-linux-musl --locked
