name: Release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  agents:
    name: Build and verify both static Linux agents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: cargo run --locked --package xtask -- stage-agents
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-agents
          path: target/cdenv-agent/${{ github.sha }}/
          if-no-files-found: error

  host:
    name: Package ${{ matrix.platform }}
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: verified-linux-agents
          path: target/verified-agents
      - name: Build locked host and smoke-test its archive
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: cargo xtask dist
      - name: Verify reproducible packaging and run package-only smoke again
        shell: bash
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: |
          cp target/dist/*.tar.sha256 target/first.sha256
          cargo clean --package cdenv-cli --release
          cargo xtask dist
          cmp target/first.sha256 target/dist/*.tar.sha256
          cargo xtask test-package target/dist/cdenv-${{ matrix.platform }}-${{ github.sha }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cdenv-${{ matrix.platform }}
          path: target/dist/
          if-no-files-found: error
