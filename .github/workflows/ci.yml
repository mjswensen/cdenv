name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Workspace quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run checks in the development container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: CARGO_TERM_COLOR
          runCmd: cargo xtask check

  macos-agent-stub:
    name: Agent unsupported-host stub
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check agent targets
        run: cargo check --package cdenv-agent --all-targets --locked

  linux-agent-targets:
    name: Agent Linux musl targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Check static agent targets
        run: |
          cargo check --package cdenv-agent --target x86_64-unknown-linux-musl --locked
          cargo check --package cdenv-agent --target aarch64-unknown-linux-musl --locked
