name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Branch instrumentation is nightly-only; correctness gates still use rust-toolchain.toml.
  COVERAGE_TOOLCHAIN: nightly-2026-09-01
  CARGO_LLVM_COV_VERSION: 0.9.0

jobs:
  quality:
    name: Strict Rust and cargo-deny quality gate
    # Keep tool validation on the supported ARM runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out clean locked repository
        uses: actions/checkout@v4
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"
      - name: Check coverage and mutation plumbing failure handling
        run: |
          bash -n .github/scripts/install-coverage.sh .github/scripts/coverage.sh
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-coverage.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-security-mutations.py
      - name: Check installer success and verification failure handling
        run: |
          sh -n install.sh
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-install.py
      - name: Run strict checks in the pinned development container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: CARGO_TERM_COLOR
          runCmd: cargo xtask check

  security-mutations:
    name: Security mutations (${{ matrix.shard }})
    # Keep security checks on the supported ARM runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [reference-lock, transport, archive-integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Require clean source and pinned Rust
        run: |
          test -z "$(git status --porcelain)"
          rustup show active-toolchain
      - name: Install pinned mutation runner
        run: cargo install cargo-mutants --version '=27.1.0' --locked
      - name: Run reviewed nonempty shard in disposable source copies
        run: python3 .github/scripts/security-mutations.py '${{ matrix.shard }}'
      - name: Independently verify source bytes even after gate failure
        if: always()
        run: python3 .github/scripts/security-mutations.py '${{ matrix.shard }}' --verify-source
      - name: Retain selection, diffs, test logs, outcomes and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-mutations-linux-arm64-${{ matrix.shard }}
          path: target/security-mutations/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  workspace-coverage:
    name: Workspace coverage (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: test -z "$(git status --porcelain)"
      - name: Use canonical macOS temporary directory spelling
        if: matrix.platform == 'macos-arm64'
        run: echo "TMPDIR=$(python3 -c 'import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"
      - name: Install pinned coverage tools
        run: bash .github/scripts/install-coverage.sh
      - name: Instrument locked ordinary workspace tests
        env:
          COVERAGE_ID: workspace-${{ matrix.platform }}
        run: bash .github/scripts/coverage.sh workspace
      - name: Retain reports and test outcome even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-workspace-${{ matrix.platform }}
          path: target/coverage/workspace-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  linux-release-gates:
    name: Linux release suites (${{ matrix.arch }}, ${{ matrix.baseline }})
    needs: linux-agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            baseline: minimum
            docker: v29.6.2
            docker_cli_arch: x86_64
            uname_arch: x86_64
            docker_cli_sha256: 0fcea2a8b4d1b54ccc9010e3451b78504a369d414f37eb3bb79300e1b5c22ce6
          - arch: x86_64
            runner: ubuntu-24.04
            baseline: pinned
            docker: v29.7.1
            docker_cli_arch: x86_64
            uname_arch: x86_64
            docker_cli_sha256: unused
          - arch: arm64
            runner: ubuntu-24.04-arm
            baseline: minimum
            docker: v29.6.2
            docker_cli_arch: aarch64
            uname_arch: aarch64
            docker_cli_sha256: 4eb4d1b21131897ed3990aac31039161bf4bdd07fcfb733e996010319ff4e069
          - arch: arm64
            runner: ubuntu-24.04-arm
            baseline: pinned
            docker: v29.7.1
            docker_cli_arch: aarch64
            uname_arch: aarch64
            docker_cli_sha256: unused
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out clean locked repository
        uses: actions/checkout@v4
      - name: Require a clean checkout and pinned Rust toolchain
        run: |
          test -z "$(git status --porcelain)"
          rustup show active-toolchain
      - name: Set up explicit Docker Engine baseline
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ matrix.docker }}
          set-host: true
      - name: Set up minimum Docker CLI independently of minimum Engine
        if: matrix.baseline == 'minimum'
        env:
          CLI_ARCH: ${{ matrix.docker_cli_arch }}
          CLI_SHA256: ${{ matrix.docker_cli_sha256 }}
        run: |
          archive="$RUNNER_TEMP/docker-29.7.1.tgz"
          curl -fsSL "https://download.docker.com/linux/static/stable/$CLI_ARCH/docker-29.7.1.tgz" -o "$archive"
          printf '%s  %s\n' "$CLI_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/docker-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/docker-cli" --strip-components=1 docker/docker
          echo "$RUNNER_TEMP/docker-cli" >> "$GITHUB_PATH"
      - name: Set up explicit minimum Compose V2 baseline
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1
      - name: Build and select verified OpenSSH baseline
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libssl-dev zlib1g-dev
          .github/scripts/install-openssh.sh
      - name: Verify exact selected dependency versions
        run: |
          test "$(docker version --format '{{.Client.Version}}')" = 29.7.1
          if [[ '${{ matrix.baseline }}' == minimum ]]; then
            test "$(docker version --format '{{.Server.Version}}')" = 29.6.2
          else
            test "$(docker version --format '{{.Server.Version}}')" = 29.7.1
          fi
          test "$(docker compose version --short)" = 5.3.1
          ssh -V 2>&1 | grep -q '^OpenSSH_10\.0p2'
          test "$(uname -m)" = '${{ matrix.uname_arch }}'
      - name: Download both natively verified static agents
        uses: actions/download-artifact@v4
        with:
          name: verified-linux-agents-ci
          path: target/verified-agents
      - name: Build packaged host with both verified static agents for credential workflows
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: |
          cargo xtask dist
          echo "CDENV_CREDENTIAL_TEST_BINARY=$PWD/target/release/cdenv" >> "$GITHUB_ENV"
      - name: Run nonempty editor-independent Dev Container profile suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
        run: cargo xtask test-integration --suite devcontainer-v1
      - name: Run nonempty credential product suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
        run: cargo xtask test-integration --suite credentials
      - name: Run nonempty standard OpenSSH interoperability suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
        run: cargo xtask test-integration --suite openssh

      # These reruns cannot substitute for either required pinned-toolchain gate above.
      - name: Install pinned coverage tools
        run: bash .github/scripts/install-coverage.sh
      - name: Instrument Dev Container release suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
          COVERAGE_ID: devcontainer-v1-linux-${{ matrix.arch }}-${{ matrix.baseline }}
        run: bash .github/scripts/coverage.sh devcontainer-v1
      - name: Instrument credential release suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
          COVERAGE_ID: credentials-linux-${{ matrix.arch }}-${{ matrix.baseline }}
        run: bash .github/scripts/coverage.sh credentials
      - name: Instrument OpenSSH release suite
        env:
          CDENV_INTEGRATION: "1"
          CDENV_INTEGRATION_ARCH: ${{ matrix.arch }}
          COVERAGE_ID: openssh-linux-${{ matrix.arch }}-${{ matrix.baseline }}
        run: bash .github/scripts/coverage.sh openssh
      - name: Retain Dev Container coverage and gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-devcontainer-v1-linux-${{ matrix.arch }}-${{ matrix.baseline }}
          path: target/coverage/devcontainer-v1-linux-${{ matrix.arch }}-${{ matrix.baseline }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain credential coverage and gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-credentials-linux-${{ matrix.arch }}-${{ matrix.baseline }}
          path: target/coverage/credentials-linux-${{ matrix.arch }}-${{ matrix.baseline }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain OpenSSH coverage and gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-openssh-linux-${{ matrix.arch }}-${{ matrix.baseline }}
          path: target/coverage/openssh-linux-${{ matrix.arch }}-${{ matrix.baseline }}/
          if-no-files-found: error
          retention-days: 14

  coverage-index:
    name: Coverage report inventory (no percentage gate)
    if: always()
    needs: [workspace-coverage, linux-release-gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: target/coverage-download
      - name: Require complete successful report inventory and summarize
        run: python3 .github/scripts/coverage-index.py target/coverage-download target/coverage-index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-index
          path: target/coverage-index/
          if-no-files-found: error
          retention-days: 14

  macos-agent-stub:
    name: Agent unsupported-host stub
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo check --package cdenv-agent --all-targets --locked

  linux-agent-targets:
    name: Agent Linux musl target (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate native static agent artifact
        run: cargo xtask stage-agent --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-agent-ci-${{ matrix.architecture }}
          path: target/cdenv-agent/${{ github.sha }}/cdenv-agent-${{ matrix.architecture }}
          if-no-files-found: error

  linux-agents:
    name: Assemble CI static Linux agents
    needs: linux-agent-targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-linux-agent-ci-*
          path: target/verified-agents
          merge-multiple: true
      - name: Validate both native artifacts and create their manifest
        run: cargo xtask finalize-agents target/verified-agents
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-agents-ci
          path: target/verified-agents/
          if-no-files-found: error
