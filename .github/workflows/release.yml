name: Release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: Build and verify static agent (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is intentionally disabled until non-ARM hosts are supported again.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: docker/setup-buildx-action@v3
      - run: cargo xtask stage-agent --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-agent-${{ matrix.architecture }}
          path: target/cdenv-agent/${{ github.sha }}/cdenv-agent-${{ matrix.architecture }}
          if-no-files-found: error

  agents:
    name: Assemble verified static Linux agents
    needs: agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-linux-agent-*
          path: target/verified-agents
          merge-multiple: true
      - name: Validate both static artifacts and create their manifest
        run: cargo xtask finalize-agents target/verified-agents
      - uses: actions/upload-artifact@v4
        with:
          name: verified-linux-agents
          path: target/verified-agents/
          if-no-files-found: error

  host:
    name: Package ${{ matrix.platform }}
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is intentionally disabled until non-ARM hosts are supported again.
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: verified-linux-agents
          path: target/verified-agents
      - name: Build locked host and smoke-test its archive
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: cargo xtask dist
      - name: Verify reproducible packaging and run package-only smoke again
        shell: bash
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: |
          cp target/dist/*.tar.sha256 target/first.sha256
          cargo clean --package cdenv-cli --release
          cargo xtask dist
          cmp target/first.sha256 target/dist/*.tar.sha256
          cargo xtask test-package target/dist/cdenv-${{ matrix.platform }}-${{ github.sha }}.tar
      - name: Set up pinned Docker for the installed Linux workflow
        if: runner.os == 'Linux'
        uses: docker/setup-docker-action@v5
        with:
          version: v29.7.1
      - name: Set up pinned Compose for the installed Linux workflow
        if: runner.os == 'Linux'
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1
      - name: Build and select baseline OpenSSH for the installed Linux workflow
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libssl-dev zlib1g-dev
          .github/scripts/install-openssh.sh
      - name: Run checksum-verified installed operational smoke
        if: runner.os == 'Linux'
        run: cargo xtask test-installed target/dist/cdenv-${{ matrix.platform }}-${{ github.sha }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cdenv-${{ matrix.platform }}
          path: target/dist/
          if-no-files-found: error

  publish:
    name: Prepare draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cdenv-*
          path: target/release-artifacts
      - name: Collect release assets
        run: |
          mkdir -p target/dist
          find target/release-artifacts -type f -name 'cdenv-*' -exec cp {} target/dist/ \;
          cp "$(find target/release-artifacts -type f -name install.sh | head -n 1)" target/dist/install.sh
      # A maintainer publishes only after retaining the macOS Docker Desktop smoke record.
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" target/dist/*
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
