[package]
name = "cdenv-feasibility-spike"
version = "0.0.0"
edition = "2024"
publish = false

# This empty workspace roots the disposable spike so it cannot become a member
# or dependency of the future production workspace.
[workspace]

[[bin]]
name = "feasibility-spike"
path = "src/main.rs"

[[bin]]
name = "feasibility-agent"
path = "src/bin/feasibility-agent.rs"

[dependencies]
bollard = { version = "=0.21.0", default-features = false, features = ["pipe"] }
flate2 = "=1.1.9"
futures-util = "=0.3.33"
hex = "=0.4.3"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
jsonschema = { version = "=0.49.7", default-features = false }
nix = { version = "=0.30.1", features = ["process", "signal"] }
pty-process = { version = "=0.5.3", features = ["async"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
russh = { version = "=0.62.5", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
