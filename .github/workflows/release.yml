name: Release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Require a SemVer tag matching the workspace and lockfile
        id: identity
        run: python3 .github/scripts/release-ready.py identity

  ci:
    name: Release commit CI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: ./.github/workflows/ci.yml

  agent:
    name: Build and verify static agent (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: docker/setup-buildx-action@v4
      - run: cargo xtask stage-agent --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release-linux-agent-${{ matrix.architecture }}
          path: target/cdenv-agent/${{ github.sha }}/cdenv-agent-${{ matrix.architecture }}
          if-no-files-found: error

  agents:
    name: Assemble verified static Linux agents
    needs: agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: verified-release-linux-agent-*
          path: target/verified-agents
          merge-multiple: true
      - name: Validate both static artifacts and create their manifest
        run: cargo xtask finalize-agents target/verified-agents
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release-linux-agents
          path: target/verified-agents/
          if-no-files-found: error

  host:
    name: Package ${{ matrix.platform }}
    timeout-minutes: 20
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore Rust build cache
        id: rust_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/coverage-build
            target/coverage-tools
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/scripts/coverage.sh', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/scripts/coverage.sh', '.github/workflows/ci.yml') }}-
      - run: rustup show active-toolchain
      - uses: actions/download-artifact@v7
        with:
          name: verified-release-linux-agents
          path: target/verified-agents
      - name: Build locked host and smoke-test its archive
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        shell: bash
        run: |
          mkdir -p target/package-evidence
          cargo xtask dist 2>&1 | tee target/package-evidence/build.log
      - name: Verify reproducible packaging and run package-only smoke again
        shell: bash
        env:
          CDENV_AGENT_ARTIFACT_DIR: ${{ github.workspace }}/target/verified-agents
        run: |
          cp target/dist/*.tar.sha256 target/first.sha256
          cargo clean --package cdenv-cli --release
          cargo xtask dist 2>&1 | tee target/package-evidence/rebuild.log
          cmp target/first.sha256 target/dist/*.tar.sha256
          cargo xtask test-package target/dist/cdenv-${{ matrix.platform }}-${{ github.sha }}.tar 2>&1 | tee target/package-evidence/package-smoke.log
      - name: Set up pinned Docker for the installed Linux workflow
        if: runner.os == 'Linux'
        uses: docker/setup-docker-action@v5
        with:
          version: v29.7.1
          set-host: true
      - name: Set up pinned Compose for the installed Linux workflow
        if: runner.os == 'Linux'
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1
      - name: Build and select baseline OpenSSH for the installed Linux workflow
        if: runner.os == 'Linux'
        run: .github/scripts/install-openssh.sh
      - name: Run checksum-verified installed operational smoke
        timeout-minutes: 5
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/package-evidence
          cargo xtask test-installed target/dist/cdenv-${{ matrix.platform }}-${{ github.sha }}.tar 2>&1 | tee target/package-evidence/installed-smoke.log
      - name: Record completed package gates
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python3 .github/scripts/release-ready.py package target/package-evidence/package.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: package-evidence-${{ matrix.platform }}
          path: target/package-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: cdenv-${{ matrix.platform }}
          path: target/dist/
          if-no-files-found: error
      - name: Save Rust build cache even after test failure
        if: ${{ !cancelled() && steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/coverage-build
            target/coverage-tools
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

  publish:
    name: Prepare review-ready draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, ci, host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: cdenv-*
          path: target/release-artifacts
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: target/release-evidence
      - uses: actions/download-artifact@v7
        with:
          pattern: security-mutations-*
          path: target/release-evidence
      - uses: actions/download-artifact@v7
        with:
          pattern: package-evidence-*
          path: target/release-evidence
      - uses: actions/download-artifact@v7
        with:
          name: ci-gate-results
          path: target/release-evidence/ci-gate-results
      - name: Validate assets and assemble durable review evidence
        run: |
          python3 .github/scripts/release-ready.py bundle target/release-artifacts target/release-evidence target/dist
      - uses: actions/upload-artifact@v6
        with:
          name: review-ready-release
          path: target/dist/
          if-no-files-found: error
      # A maintainer publishes only after retaining the macOS Docker Desktop smoke record.
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" target/dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag \
            --notes-file target/dist/release-review.md "${flags[@]}"
